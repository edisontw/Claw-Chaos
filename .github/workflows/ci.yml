name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Verify GitHub Pages base path
        shell: bash
        run: |
          if grep -Eq '(src|href)="/assets/' dist/index.html; then
            echo "Found a root-relative production asset path."
            cat dist/index.html
            exit 1
          fi
          grep -Eq '(src|href)="/Claw-Chaos/assets/' dist/index.html

      - name: Verify startup bundle split
        shell: bash
        run: |
          ENTRY_PATH=$(grep -oE '/Claw-Chaos/assets/[^"]+\.js' dist/index.html | head -n 1)
          test -n "$ENTRY_PATH"
          ENTRY_FILE="dist/${ENTRY_PATH#/Claw-Chaos/}"
          ENTRY_BYTES=$(stat -c%s "$ENTRY_FILE")
          echo "Bootstrap entry: $ENTRY_FILE ($ENTRY_BYTES bytes)"
          if [ "$ENTRY_BYTES" -gt 25000 ]; then
            echo "Bootstrap entry regressed above 25 KB; heavy startup modules may be back on the critical path."
            exit 1
          fi

          RAPIER_WASM=$(find dist/assets -maxdepth 1 -type f -name 'rapier_wasm3d_bg-*.wasm' | head -n 1)
          test -n "$RAPIER_WASM"
          RAPIER_WASM_BYTES=$(stat -c%s "$RAPIER_WASM")
          echo "Rapier WASM: $RAPIER_WASM ($RAPIER_WASM_BYTES bytes)"
          if [ "$RAPIER_WASM_BYTES" -gt 3500000 ]; then
            echo "Rapier WASM unexpectedly exceeds 3.5 MB."
            exit 1
          fi

          PHYSICS_JS=$(find dist/assets -maxdepth 1 -type f -name 'PhysicsRuntime-*.js' | head -n 1)
          test -n "$PHYSICS_JS"
          PHYSICS_JS_BYTES=$(stat -c%s "$PHYSICS_JS")
          echo "PhysicsRuntime JS: $PHYSICS_JS ($PHYSICS_JS_BYTES bytes)"
          if [ "$PHYSICS_JS_BYTES" -gt 500000 ]; then
            echo "PhysicsRuntime JS regressed above 500 KB; compat/base64 WASM may have returned to the browser bundle."
            exit 1
          fi

      - name: Preview smoke test
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/claw-chaos-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT

          READY=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/Claw-Chaos/ -o /tmp/claw-chaos-index.html; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/claw-chaos-preview.log
            exit 1
          fi

          ASSET_PATH=$(grep -oE '/Claw-Chaos/assets/[^"]+\.js' /tmp/claw-chaos-index.html | head -n 1)
          test -n "$ASSET_PATH"
          curl --fail --silent "http://127.0.0.1:4173$ASSET_PATH" -o /dev/null

          BROWSER=$(command -v google-chrome || command -v chromium || true)
          test -n "$BROWSER"

          BROWSER_READY=0
          for attempt in 1 2 3; do
            DOM_FILE="/tmp/claw-chaos-dom-$attempt.html"
            LOG_FILE="/tmp/claw-chaos-browser-$attempt.log"

            timeout 30s "$BROWSER" \
              --headless=new \
              --no-sandbox \
              --disable-dev-shm-usage \
              --use-gl=angle \
              --use-angle=swiftshader \
              --enable-webgl \
              --enable-unsafe-swiftshader \
              --virtual-time-budget=8000 \
              --dump-dom \
              "http://127.0.0.1:4173/Claw-Chaos/?scene=gantry-lab&seed=ci-smoke" \
              > "$DOM_FILE" 2> "$LOG_FILE" || true

            if grep -q 'data-simulation-ready="true"' "$DOM_FILE" &&
               grep -q 'data-bootstrap="parallel"' "$DOM_FILE" &&
               grep -q 'data-physics-backend="native-wasm"' "$DOM_FILE" &&
               grep -q 'data-startup-ms=' "$DOM_FILE" &&
               grep -q 'gantry-lab' "$DOM_FILE"; then
              BROWSER_READY=1
              break
            fi

            echo "Headless browser smoke attempt $attempt did not reach gantry-lab readiness."
            sleep 1
          done

          if [ "$BROWSER_READY" -ne 1 ]; then
            echo "Headless browser failed to initialize gantry-lab after 3 attempts."
            for file in /tmp/claw-chaos-browser-*.log; do
              echo "===== $file ====="
              cat "$file"
            done
            exit 1
          fi

          echo "Preview/browser gantry-lab smoke passed: $ASSET_PATH"

          CABINET_READY=0
          for attempt in 1 2 3; do
            DOM_FILE="/tmp/claw-chaos-cabinet-dom-$attempt.html"
            LOG_FILE="/tmp/claw-chaos-cabinet-browser-$attempt.log"

            timeout 30s "$BROWSER" \
              --headless=new \
              --no-sandbox \
              --disable-dev-shm-usage \
              --use-gl=angle \
              --use-angle=swiftshader \
              --enable-webgl \
              --enable-unsafe-swiftshader \
              --virtual-time-budget=8000 \
              --dump-dom \
              "http://127.0.0.1:4173/Claw-Chaos/?scene=cabinet-lab&layout=dense&seed=ci-m09-dense" \
              > "$DOM_FILE" 2> "$LOG_FILE" || true

            if grep -q 'data-simulation-ready="true"' "$DOM_FILE" &&
               grep -q 'data-bootstrap="parallel"' "$DOM_FILE" &&
               grep -q 'data-physics-backend="native-wasm"' "$DOM_FILE" &&
               grep -q 'data-startup-ms=' "$DOM_FILE" &&
               grep -q 'data-scene-id="cabinet-lab"' "$DOM_FILE" &&
               grep -q 'data-visual-theme="modern-japanese-arcade"' "$DOM_FILE" &&
               grep -q 'data-arcade-environment="modern-japanese-arcade:prize-center-room-v1"' "$DOM_FILE" &&
               grep -q 'data-staff-character="adult-female-arcade-attendant-v1"' "$DOM_FILE" &&
               grep -q 'data-tone-mapping="aces-filmic"' "$DOM_FILE" &&
               grep -q 'data-player-view="active"' "$DOM_FILE" &&
               grep -q 'player-interaction-prompt' "$DOM_FILE" &&
               ! grep -q 'player-reticle' "$DOM_FILE" &&
               grep -q 'data-mobile-controls="ready"' "$DOM_FILE" &&
               grep -q 'mobile-view-height' "$DOM_FILE" &&
               grep -q 'data-render-profile="desktop"' "$DOM_FILE" &&
               grep -q 'data-machine-audio="armed"' "$DOM_FILE" &&
               grep -q 'data-arcade-ambience="armed"' "$DOM_FILE" &&
               grep -q 'data-controller-haptics="armed"' "$DOM_FILE" &&
               grep -q 'data-layout-id="dense"' "$DOM_FILE" &&
               grep -q 'data-staff-call-control="ready"' "$DOM_FILE" &&
               grep -q 'data-staff-state="locked"' "$DOM_FILE"; then
              CABINET_READY=1
              break
            fi

            echo "Headless browser smoke attempt $attempt did not reach cabinet-lab readiness."
            sleep 1
          done

          if [ "$CABINET_READY" -ne 1 ]; then
            echo "Headless browser failed to initialize cabinet-lab after 3 attempts."
            for file in /tmp/claw-chaos-cabinet-browser-*.log; do
              echo "===== $file ====="
              cat "$file"
            done
            exit 1
          fi

          echo "Preview/browser cabinet-lab smoke passed: $ASSET_PATH"

          SHOWCASE_READY=0
          for attempt in 1 2 3; do
            SHOWCASE_DOM_FILE="/tmp/claw-chaos-showcase-dom-$attempt.html"
            SHOWCASE_LOG_FILE="/tmp/claw-chaos-showcase-browser-$attempt.log"

            timeout 30s "$BROWSER" \
              --headless=new \
              --no-sandbox \
              --disable-dev-shm-usage \
              --use-gl=angle \
              --use-angle=swiftshader \
              --enable-webgl \
              --enable-unsafe-swiftshader \
              --virtual-time-budget=8000 \
              --dump-dom \
              "http://127.0.0.1:4173/Claw-Chaos/?scene=cabinet-lab&layout=showcase&seed=ci-m09-showcase" \
              > "$SHOWCASE_DOM_FILE" 2> "$SHOWCASE_LOG_FILE" || true

            if grep -q 'data-simulation-ready="true"' "$SHOWCASE_DOM_FILE" &&
               grep -q 'data-physics-backend="native-wasm"' "$SHOWCASE_DOM_FILE" &&
               grep -q 'data-scene-id="cabinet-lab"' "$SHOWCASE_DOM_FILE" &&
               grep -q 'data-layout-id="showcase"' "$SHOWCASE_DOM_FILE" &&
               grep -q 'data-player-view="active"' "$SHOWCASE_DOM_FILE" &&
               ! grep -q 'player-reticle' "$SHOWCASE_DOM_FILE" &&
               grep -q 'data-machine-audio="armed"' "$SHOWCASE_DOM_FILE"; then
              SHOWCASE_READY=1
              break
            fi

            echo "Headless browser showcase smoke attempt $attempt did not reach readiness."
            sleep 1
          done

          if [ "$SHOWCASE_READY" -ne 1 ]; then
            echo "Headless browser failed to initialize M09 showcase layout."
            for file in /tmp/claw-chaos-showcase-browser-*.log; do
              echo "===== $file ====="
              cat "$file"
            done
            exit 1
          fi

          echo "Preview/browser M09 showcase layout smoke passed: $ASSET_PATH"

          BRIDGE_READY=0
          for attempt in 1 2 3; do
            BRIDGE_DOM_FILE="/tmp/claw-chaos-bridge-dom-$attempt.html"
            BRIDGE_LOG_FILE="/tmp/claw-chaos-bridge-browser-$attempt.log"

            timeout 30s "$BROWSER" \
              --headless=new \
              --no-sandbox \
              --disable-dev-shm-usage \
              --use-gl=angle \
              --use-angle=swiftshader \
              --enable-webgl \
              --enable-unsafe-swiftshader \
              --virtual-time-budget=8000 \
              --dump-dom \
              "http://127.0.0.1:4173/Claw-Chaos/?scene=cabinet-lab&layout=bridge&seed=ci-m09-bridge" \
              > "$BRIDGE_DOM_FILE" 2> "$BRIDGE_LOG_FILE" || true

            if grep -q 'data-simulation-ready="true"' "$BRIDGE_DOM_FILE" &&
               grep -q 'data-physics-backend="native-wasm"' "$BRIDGE_DOM_FILE" &&
               grep -q 'data-scene-id="cabinet-lab"' "$BRIDGE_DOM_FILE" &&
               grep -q 'data-layout-id="bridge"' "$BRIDGE_DOM_FILE" &&
               grep -q 'data-player-view="active"' "$BRIDGE_DOM_FILE" &&
               ! grep -q 'player-reticle' "$BRIDGE_DOM_FILE" &&
               grep -q 'data-machine-audio="armed"' "$BRIDGE_DOM_FILE"; then
              BRIDGE_READY=1
              break
            fi

            echo "Headless browser bridge smoke attempt $attempt did not reach readiness."
            sleep 1
          done

          if [ "$BRIDGE_READY" -ne 1 ]; then
            echo "Headless browser failed to initialize M09 bridge layout."
            for file in /tmp/claw-chaos-bridge-browser-*.log; do
              echo "===== $file ====="
              cat "$file"
            done
            exit 1
          fi

          echo "Preview/browser M09 bridge layout smoke passed: $ASSET_PATH"

          EDGE_READY=0
          for attempt in 1 2 3; do
            EDGE_DOM_FILE="/tmp/claw-chaos-edge-dom-$attempt.html"
            EDGE_LOG_FILE="/tmp/claw-chaos-edge-browser-$attempt.log"

            timeout 30s "$BROWSER" \
              --headless=new \
              --no-sandbox \
              --disable-dev-shm-usage \
              --use-gl=angle \
              --use-angle=swiftshader \
              --enable-webgl \
              --enable-unsafe-swiftshader \
              --virtual-time-budget=8000 \
              --dump-dom \
              "http://127.0.0.1:4173/Claw-Chaos/?scene=cabinet-lab&layout=edge&seed=ci-m09-edge" \
              > "$EDGE_DOM_FILE" 2> "$EDGE_LOG_FILE" || true

            if grep -q 'data-simulation-ready="true"' "$EDGE_DOM_FILE" &&
               grep -q 'data-physics-backend="native-wasm"' "$EDGE_DOM_FILE" &&
               grep -q 'data-scene-id="cabinet-lab"' "$EDGE_DOM_FILE" &&
               grep -q 'data-layout-id="edge"' "$EDGE_DOM_FILE" &&
               grep -q 'data-player-view="active"' "$EDGE_DOM_FILE" &&
               ! grep -q 'player-reticle' "$EDGE_DOM_FILE" &&
               grep -q 'data-machine-audio="armed"' "$EDGE_DOM_FILE"; then
              EDGE_READY=1
              break
            fi

            echo "Headless browser edge smoke attempt $attempt did not reach readiness."
            sleep 1
          done

          if [ "$EDGE_READY" -ne 1 ]; then
            echo "Headless browser failed to initialize M09 edge layout."
            for file in /tmp/claw-chaos-edge-browser-*.log; do
              echo "===== $file ====="
              cat "$file"
            done
            exit 1
          fi

          echo "Preview/browser M09 edge layout smoke passed: $ASSET_PATH"

          RING_READY=0
          for attempt in 1 2 3; do
            RING_DOM_FILE="/tmp/claw-chaos-ring-dom-$attempt.html"
            RING_LOG_FILE="/tmp/claw-chaos-ring-browser-$attempt.log"

            timeout 30s "$BROWSER" \
              --headless=new \
              --no-sandbox \
              --disable-dev-shm-usage \
              --use-gl=angle \
              --use-angle=swiftshader \
              --enable-webgl \
              --enable-unsafe-swiftshader \
              --virtual-time-budget=8000 \
              --dump-dom \
              "http://127.0.0.1:4173/Claw-Chaos/?scene=cabinet-lab&layout=ring&seed=ci-m09-ring" \
              > "$RING_DOM_FILE" 2> "$RING_LOG_FILE" || true

            if grep -q 'data-simulation-ready="true"' "$RING_DOM_FILE" &&
               grep -q 'data-physics-backend="native-wasm"' "$RING_DOM_FILE" &&
               grep -q 'data-scene-id="cabinet-lab"' "$RING_DOM_FILE" &&
               grep -q 'data-layout-id="ring"' "$RING_DOM_FILE" &&
               grep -q 'data-player-view="active"' "$RING_DOM_FILE" &&
               ! grep -q 'player-reticle' "$RING_DOM_FILE" &&
               grep -q 'data-machine-audio="armed"' "$RING_DOM_FILE"; then
              RING_READY=1
              break
            fi

            echo "Headless browser ring smoke attempt $attempt did not reach readiness."
            sleep 1
          done

          if [ "$RING_READY" -ne 1 ]; then
            echo "Headless browser failed to initialize M09 ring layout."
            for file in /tmp/claw-chaos-ring-browser-*.log; do
              echo "===== $file ====="
              cat "$file"
            done
            exit 1
          fi

          echo "Preview/browser M09 ring layout smoke passed: $ASSET_PATH"

          CHUTE_READY=0
          for attempt in 1 2 3; do
            CHUTE_DOM_FILE="/tmp/claw-chaos-chute-dom-$attempt.html"
            CHUTE_LOG_FILE="/tmp/claw-chaos-chute-browser-$attempt.log"

            timeout 30s "$BROWSER" \
              --headless=new \
              --no-sandbox \
              --disable-dev-shm-usage \
              --use-gl=angle \
              --use-angle=swiftshader \
              --enable-webgl \
              --enable-unsafe-swiftshader \
              --virtual-time-budget=8000 \
              --dump-dom \
              "http://127.0.0.1:4173/Claw-Chaos/?scene=cabinet-lab&layout=chute&seed=ci-m09-chute" \
              > "$CHUTE_DOM_FILE" 2> "$CHUTE_LOG_FILE" || true

            if grep -q 'data-simulation-ready="true"' "$CHUTE_DOM_FILE" &&
               grep -q 'data-physics-backend="native-wasm"' "$CHUTE_DOM_FILE" &&
               grep -q 'data-scene-id="cabinet-lab"' "$CHUTE_DOM_FILE" &&
               grep -q 'data-layout-id="chute"' "$CHUTE_DOM_FILE" &&
               grep -q 'data-player-view="active"' "$CHUTE_DOM_FILE" &&
               ! grep -q 'player-reticle' "$CHUTE_DOM_FILE" &&
               grep -q 'data-machine-audio="armed"' "$CHUTE_DOM_FILE"; then
              CHUTE_READY=1
              break
            fi

            echo "Headless browser chute smoke attempt $attempt did not reach readiness."
            sleep 1
          done

          if [ "$CHUTE_READY" -ne 1 ]; then
            echo "Headless browser failed to initialize M09 chute layout."
            for file in /tmp/claw-chaos-chute-browser-*.log; do
              echo "===== $file ====="
              cat "$file"
            done
            exit 1
          fi

          echo "Preview/browser M09 chute layout smoke passed: $ASSET_PATH"

          ROOT_READY=0
          for attempt in 1 2 3; do
            ROOT_DOM_FILE="/tmp/claw-chaos-root-dom-$attempt.html"
            ROOT_LOG_FILE="/tmp/claw-chaos-root-browser-$attempt.log"
            timeout 30s "$BROWSER" \
              --headless=new \
              --no-sandbox \
              --disable-dev-shm-usage \
              --use-gl=angle \
              --use-angle=swiftshader \
              --enable-webgl \
              --enable-unsafe-swiftshader \
              --virtual-time-budget=8000 \
              --dump-dom \
              "http://127.0.0.1:4173/Claw-Chaos/" \
              > "$ROOT_DOM_FILE" 2> "$ROOT_LOG_FILE" || true

            if grep -q 'data-simulation-ready="true"' "$ROOT_DOM_FILE" &&
               grep -q 'data-bootstrap="parallel"' "$ROOT_DOM_FILE" &&
               grep -q 'data-physics-backend="native-wasm"' "$ROOT_DOM_FILE" &&
               grep -q 'data-startup-ms=' "$ROOT_DOM_FILE" &&
               grep -q 'data-scene-id="cabinet-lab"' "$ROOT_DOM_FILE" &&
               grep -q 'data-visual-theme="modern-japanese-arcade"' "$ROOT_DOM_FILE" &&
               grep -q 'data-arcade-environment="modern-japanese-arcade:prize-center-room-v1"' "$ROOT_DOM_FILE" &&
               grep -q 'data-staff-character="adult-female-arcade-attendant-v1"' "$ROOT_DOM_FILE" &&
               grep -q 'data-tone-mapping="aces-filmic"' "$ROOT_DOM_FILE" &&
               grep -q 'data-player-view="active"' "$ROOT_DOM_FILE" &&
               ! grep -q 'player-reticle' "$ROOT_DOM_FILE" &&
               grep -q 'data-mobile-controls="ready"' "$ROOT_DOM_FILE" &&
               grep -q 'data-mobile-control-style="compact-translucent"' "$ROOT_DOM_FILE" &&
               grep -q 'mobile-view-height' "$ROOT_DOM_FILE" &&
               grep -q 'data-render-profile="desktop"' "$ROOT_DOM_FILE" &&
               grep -q 'data-machine-audio="armed"' "$ROOT_DOM_FILE" &&
               grep -q 'data-arcade-ambience="armed"' "$ROOT_DOM_FILE" &&
               grep -q 'data-controller-haptics="armed"' "$ROOT_DOM_FILE" &&
               grep -q 'data-layout-id="loose"' "$ROOT_DOM_FILE" &&
               grep -q 'data-staff-call-control="ready"' "$ROOT_DOM_FILE" &&
               grep -q 'data-staff-state="locked"' "$ROOT_DOM_FILE"; then
              ROOT_READY=1
              break
            fi

            echo "Headless browser root smoke attempt $attempt did not reach readiness."
            sleep 1
          done

          if [ "$ROOT_READY" -ne 1 ]; then
            echo "Root URL did not initialize the default cabinet-lab player view."
            for file in /tmp/claw-chaos-root-browser-*.log; do
              echo "===== $file ====="
              cat "$file"
            done
            exit 1
          fi

          echo "Preview/browser root default cabinet-lab smoke passed: $ASSET_PATH"
