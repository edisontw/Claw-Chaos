name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Verify GitHub Pages base path
        shell: bash
        run: |
          if grep -Eq '(src|href)="/assets/' dist/index.html; then
            echo "Found a root-relative production asset path."
            cat dist/index.html
            exit 1
          fi
          grep -Eq '(src|href)="/Claw-Chaos/assets/' dist/index.html

      - name: Preview smoke test
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/claw-chaos-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT

          READY=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/Claw-Chaos/ -o /tmp/claw-chaos-index.html; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/claw-chaos-preview.log
            exit 1
          fi

          ASSET_PATH=$(grep -oE '/Claw-Chaos/assets/[^"]+\.js' /tmp/claw-chaos-index.html | head -n 1)
          test -n "$ASSET_PATH"
          curl --fail --silent "http://127.0.0.1:4173$ASSET_PATH" -o /dev/null

          BROWSER=$(command -v google-chrome || command -v chromium || true)
          test -n "$BROWSER"

          BROWSER_READY=0
          for attempt in 1 2 3; do
            DOM_FILE="/tmp/claw-chaos-dom-$attempt.html"
            LOG_FILE="/tmp/claw-chaos-browser-$attempt.log"

            timeout 30s "$BROWSER" \
              --headless=new \
              --no-sandbox \
              --disable-dev-shm-usage \
              --use-gl=angle \
              --use-angle=swiftshader \
              --enable-webgl \
              --enable-unsafe-swiftshader \
              --virtual-time-budget=8000 \
              --dump-dom \
              "http://127.0.0.1:4173/Claw-Chaos/?scene=gantry-lab&seed=ci-smoke" \
              > "$DOM_FILE" 2> "$LOG_FILE" || true

            if grep -q 'data-simulation-ready="true"' "$DOM_FILE" &&
               grep -q 'gantry-lab' "$DOM_FILE"; then
              BROWSER_READY=1
              break
            fi

            echo "Headless browser smoke attempt $attempt did not reach gantry-lab readiness."
            sleep 1
          done

          if [ "$BROWSER_READY" -ne 1 ]; then
            echo "Headless browser failed to initialize gantry-lab after 3 attempts."
            for file in /tmp/claw-chaos-browser-*.log; do
              echo "===== $file ====="
              cat "$file"
            done
            exit 1
          fi

          echo "Preview/browser gantry-lab smoke passed: $ASSET_PATH"

          CABINET_READY=0
          for attempt in 1 2 3; do
            DOM_FILE="/tmp/claw-chaos-cabinet-dom-$attempt.html"
            LOG_FILE="/tmp/claw-chaos-cabinet-browser-$attempt.log"

            timeout 30s "$BROWSER" \
              --headless=new \
              --no-sandbox \
              --disable-dev-shm-usage \
              --use-gl=angle \
              --use-angle=swiftshader \
              --enable-webgl \
              --enable-unsafe-swiftshader \
              --virtual-time-budget=8000 \
              --dump-dom \
              "http://127.0.0.1:4173/Claw-Chaos/?scene=cabinet-lab&seed=ci-smoke" \
              > "$DOM_FILE" 2> "$LOG_FILE" || true

            if grep -q 'data-simulation-ready="true"' "$DOM_FILE" &&
               grep -q 'cabinet-lab' "$DOM_FILE" &&
               grep -q 'Player view' "$DOM_FILE" &&
               grep -q 'data-player-view="active"' "$DOM_FILE" &&
               grep -q 'player-interaction-prompt' "$DOM_FILE"; then
              CABINET_READY=1
              break
            fi

            echo "Headless browser smoke attempt $attempt did not reach cabinet-lab readiness."
            sleep 1
          done

          if [ "$CABINET_READY" -ne 1 ]; then
            echo "Headless browser failed to initialize cabinet-lab after 3 attempts."
            for file in /tmp/claw-chaos-cabinet-browser-*.log; do
              echo "===== $file ====="
              cat "$file"
            done
            exit 1
          fi

          echo "Preview/browser cabinet-lab smoke passed: $ASSET_PATH"

          ROOT_DOM_FILE="/tmp/claw-chaos-root-dom.html"
          ROOT_LOG_FILE="/tmp/claw-chaos-root-browser.log"
          timeout 30s "$BROWSER" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --use-gl=angle \
            --use-angle=swiftshader \
            --enable-webgl \
            --enable-unsafe-swiftshader \
            --virtual-time-budget=8000 \
            --dump-dom \
            "http://127.0.0.1:4173/Claw-Chaos/" \
            > "$ROOT_DOM_FILE" 2> "$ROOT_LOG_FILE" || true

          if ! grep -q 'data-simulation-ready="true"' "$ROOT_DOM_FILE" ||
             ! grep -q 'cabinet-lab' "$ROOT_DOM_FILE" ||
             ! grep -q 'data-player-view="active"' "$ROOT_DOM_FILE"; then
            echo "Root URL did not initialize the default cabinet-lab player view."
            cat "$ROOT_LOG_FILE"
            exit 1
          fi

          echo "Preview/browser root default cabinet-lab smoke passed: $ASSET_PATH"
