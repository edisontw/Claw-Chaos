name: Vendor Three.js DRACO runtime

on:
  push:
    branches: ["art/theme-a-modern-japanese-arcade"]
    paths:
      - ".github/workflows/vendor-draco-runtime.yml"

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: art/theme-a-modern-japanese-arcade
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install pinned project dependencies
        run: npm ci
      - name: Copy pinned Three.js DRACO decoder
        shell: bash
        run: |
          SRC="node_modules/three/examples/jsm/libs/draco"
          test -f "$SRC/draco_wasm_wrapper.js"
          test -f "$SRC/draco_decoder.wasm"
          test -f "$SRC/draco_decoder.js"
          mkdir -p public/assets/draco
          cp "$SRC/draco_wasm_wrapper.js" public/assets/draco/
          cp "$SRC/draco_decoder.wasm" public/assets/draco/
          cp "$SRC/draco_decoder.js" public/assets/draco/
          printf '%s\n'             "Vendored from three@0.186.0 examples/jsm/libs/draco."             "Used only to decode local KHR_draco_mesh_compression staff assets."             > public/assets/draco/NOTICE.txt
      - name: Commit runtime decoder
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/draco
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: vendor Three.js DRACO runtime"
          git push origin HEAD:art/theme-a-modern-japanese-arcade
